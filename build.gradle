apply plugin: 'java'
apply plugin: 'eclipse'
apply plugin: 'idea'
apply plugin: 'maven-publish'

dependencies {
    testImplementation 'commons-codec:commons-codec:1.22.1'
    testImplementation 'org.apache.commons:commons-collections4:4.6.0'
    testImplementation 'org.apache.commons:commons-imaging:1.0.0-alpha6'
    testImplementation 'org.apache.commons:commons-lang3:3.20.0'
    testImplementation 'com.jakewharton:disklrucache:2.0.2'
    testImplementation 'com.squareup:javapoet:1.13.0'
    testImplementation 'com.squareup:javawriter:2.5.1'
    testImplementation 'joda-time:joda-time:2.14.3'
    testImplementation 'org.joda:joda-convert:3.0.1'
    testImplementation 'org.jsoup:jsoup:1.23.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'javax.jms:javax.jms-api:2.0.1'
    testImplementation 'javax.mail:javax.mail-api:1.6.2'
    testImplementation 'com.squareup.mimecraft:mimecraft:1.1.1'
    testImplementation 'org.scribe:scribe:1.3.7'
    testImplementation 'com.sparkjava:spark-core:2.9.4'
    testImplementation 'log4j:log4j:1.2.17'
    testImplementation 'com.google.guava:guava:33.6.0-jre'
}

version='1.2.0'

tasks.withType(JavaCompile) {
    sourceCompatibility = targetCompatibility = '25'
    options.compilerArgs << '-Xlint:deprecation'
    options.compilerArgs << '-Xlint:unchecked'
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

jar {
    manifest {
        attributes 'JD-Core-Version': version
    }
}

// Publication to Maven repository
task sourceJar(type: Jar) {
    archiveClassifier = 'sources'
    from sourceSets.main.allJava
}

publishing {
    publications {
        publicationJdCore(MavenPublication) {
            groupId 'org.jd'
            artifactId 'jd-core'
            version project.version
            from components.java
            artifact tasks.sourceJar
        }
    }
}

// 'cleanIdea' task extension //
cleanIdea.doFirst {
    delete project.name + '.iws'
    delete 'out'
    followSymlinks = true
}
